<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="PLACEHOLDER 焼鳥の盛り合わせ">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221a12"/><stop offset="1" stop-color="#0c0906"/>
    </linearGradient>
    <linearGradient id="meat4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eeb068"/><stop offset=".45" stop-color="#c67a34"/>
      <stop offset=".8" stop-color="#8d4818"/><stop offset="1" stop-color="#54250c"/>
    </linearGradient>
    <linearGradient id="stick4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0c9a4"/><stop offset="1" stop-color="#947c57"/>
    </linearGradient>
    <radialGradient id="light4" cx="46%" cy="30%" r="62%">
      <stop offset="0" stop-color="#ffdfae" stop-opacity=".28"/><stop offset="1" stop-color="#ffdfae" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh4"><feGaussianBlur stdDeviation="14"/></filter>
    <radialGradient id="vig4" cx="50%" cy="48%" r="70%">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".66"/>
    </radialGradient>
    <g id="sk4">
      <rect x="-210" y="-4" width="420" height="8" rx="4" fill="url(#stick4)"/>
      <g fill="url(#meat4)">
        <rect x="-120" y="-27" width="66" height="54" rx="21"/>
        <rect x="-44" y="-30" width="70" height="60" rx="23"/>
        <rect x="36" y="-27" width="66" height="54" rx="21"/>
      </g>
      <g fill="#fff" fill-opacity=".18">
        <rect x="-120" y="-27" width="66" height="22" rx="11"/>
        <rect x="-44" y="-30" width="70" height="24" rx="12"/>
        <rect x="36" y="-27" width="66" height="22" rx="11"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#bg4)"/>
  <rect width="1200" height="900" fill="url(#light4)"/>

  <!-- 皿 -->
  <ellipse cx="600" cy="520" rx="392" ry="150" fill="#000" opacity=".45" filter="url(#sh4)"/>
  <ellipse cx="600" cy="500" rx="376" ry="142" fill="#14100c"/>
  <ellipse cx="600" cy="494" rx="360" ry="134" fill="#1f1811"/>
  <ellipse cx="600" cy="490" rx="330" ry="120" fill="#120d09"/>

  <g>
    <use href="#sk4" transform="translate(600 410) rotate(-7)"/>
    <use href="#sk4" transform="translate(590 470) rotate(-2)"/>
    <use href="#sk4" transform="translate(608 528) rotate(4)"/>
    <use href="#sk4" transform="translate(596 584) rotate(9)" opacity=".95"/>
  </g>

  <!-- 薬味 -->
  <g fill="#8fae5e" opacity=".9">
    <ellipse cx="300" cy="470" rx="20" ry="9"/><ellipse cx="332" cy="492" rx="17" ry="8"/>
    <ellipse cx="880" cy="500" rx="19" ry="9"/>
  </g>
  <rect width="1200" height="900" fill="url(#vig4)"/>
</svg>
