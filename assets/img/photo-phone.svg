    <linearGradient id="cellB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3b55"/><stop offset="1" stop-color="#111a2c"/>
    </linearGradient>
    <filter id="shp"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="900" height="900" fill="url(#bgp)"/>
  <ellipse cx="470" cy="800" rx="250" ry="46" fill="#000" opacity=".22" filter="url(#shp)"/>

  <g transform="translate(450 452) rotate(-6) translate(-450 -452)">
