    <rect x="299" y="134" width="302" height="636" rx="36" fill="#f6f4f1"/>
    <rect x="404" y="140" width="92" height="17" rx="9" fill="#0c0f16"/>

    <!-- プロフィール -->
    <circle cx="342" cy="204" r="24" fill="#b8302a"/>
    <circle cx="342" cy="204" r="19" fill="#f4efe4"/>
    <circle cx="342" cy="204" r="6" fill="#14203a"/>
    <rect x="378" y="192" width="150" height="11" rx="5" fill="#2b2b2b"/>
    <rect x="378" y="211" width="104" height="9" rx="4" fill="#9a9a9a"/>

    <!-- グリッド -->
    <g>
      <rect x="311" y="250" width="92" height="92" fill="url(#cellA)"/>
      <rect x="407" y="250" width="92" height="92" fill="url(#cellB)"/>
      <rect x="503" y="250" width="92" height="92" fill="url(#cellA)"/>
      <rect x="311" y="346" width="92" height="92" fill="url(#cellB)"/>
      <rect x="407" y="346" width="92" height="92" fill="url(#cellA)"/>
      <rect x="503" y="346" width="92" height="92" fill="url(#cellB)"/>
      <rect x="311" y="442" width="92" height="92" fill="url(#cellA)"/>
      <rect x="407" y="442" width="92" height="92" fill="url(#cellB)"/>
      <rect x="503" y="442" width="92" height="92" fill="url(#cellA)"/>
      <rect x="311" y="538" width="92" height="92" fill="url(#cellB)"/>
      <rect x="407" y="538" width="92" height="92" fill="url(#cellA)"/>
      <rect x="503" y="538" width="92" height="92" fill="url(#cellB)"/>
