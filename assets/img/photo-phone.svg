<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img" aria-label="PLACEHOLDER Instagram画面">
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e0d0"/><stop offset="1" stop-color="#cdc3ae"/>
    </linearGradient>
    <linearGradient id="cellA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a46"/><stop offset="1" stop-color="#5c2c10"/>
