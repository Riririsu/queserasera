    <rect x="556" y="404" width="80" height="88" rx="18"/>
    <rect x="556" y="506" width="80" height="88" rx="18"/>
    <rect x="556" y="608" width="80" height="88" rx="18"/>
    <rect x="756" y="404" width="80" height="88" rx="18"/>
    <rect x="756" y="506" width="80" height="88" rx="18"/>
