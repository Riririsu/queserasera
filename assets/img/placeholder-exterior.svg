<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="PLACEHOLDER 入口・受け取り位置が分かる外観">
  <defs>
    <radialGradient id="g2" cx="38%" cy="88%" r="56%">
      <stop offset="0" stop-color="#f6f3ec" stop-opacity=".20"/>
      <stop offset="1" stop-color="#f6f3ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="#0a1120"/>

  <!-- 外壁 -->
  <rect x="60" y="120" width="700" height="520" fill="#0d1728" stroke="#f6f3ec" stroke-opacity=".10"/>
  <rect x="120" y="186" width="420" height="84" fill="#f6f3ec"/>
  <text x="330" y="242" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif"
        font-size="40" letter-spacing="8" fill="#0a1120">けむり</text>
  <rect x="120" y="284" width="420" height="5" fill="#cf3a2d"/>

  <!-- 入口／受け取り口 -->
  <rect x="180" y="360" width="300" height="280" fill="#f6f3ec" fill-opacity=".08" stroke="#f6f3ec" stroke-opacity=".22"/>
  <rect x="180" y="360" width="300" height="58" fill="#cf3a2d" fill-opacity=".80"/>
  <ellipse cx="330" cy="650" rx="260" ry="70" fill="url(#g2)"/>

  <!-- 受け取り位置の指示 -->
  <circle cx="330" cy="500" r="30" fill="none" stroke="#cf3a2d" stroke-width="3"/>
  <circle cx="330" cy="500" r="6" fill="#cf3a2d"/>
  <line x1="330" y1="470" x2="330" y2="392" stroke="#cf3a2d" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="372" y="506" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="22"
        letter-spacing="3" fill="#f6f3ec" fill-opacity=".72">受け取り</text>

  <!-- 店前の駐車スペース（台数は未確認のため区画線のみ） -->
  <rect x="820" y="400" width="320" height="240" fill="none" stroke="#f6f3ec" stroke-opacity=".22" stroke-dasharray="12 10"/>
  <text x="980" y="524" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif"
        font-size="21" letter-spacing="3" fill="#f6f3ec" fill-opacity=".52">店前に駐車</text>
  <text x="980" y="560" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="14" letter-spacing="3" fill="#f6f3ec" fill-opacity=".30">台数 TO CONFIRM</text>

  <!-- 地面 -->
  <rect x="0" y="640" width="1200" height="160" fill="#080e1a"/>
  <line x1="0" y1="640" x2="1200" y2="640" stroke="#f6f3ec" stroke-opacity=".12"/>

</svg>
