<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="PLACEHOLDER 店舗外観">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#111d33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#f6f3ec" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f6f3ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f6f3ec" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f6f3ec" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- 建物（濃紺の外壁） -->
  <rect x="150" y="170" width="900" height="600" fill="#0d1728"/>
  <rect x="150" y="170" width="900" height="600" fill="none" stroke="#f6f3ec" stroke-opacity=".10"/>
  <rect x="150" y="170" width="900" height="26" fill="#0a1120"/>

  <!-- 白い店舗サイン -->
  <rect x="300" y="250" width="600" height="118" fill="#f6f3ec"/>
  <text x="600" y="316" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif"
        font-size="52" letter-spacing="10" fill="#0a1120">燻製塩焼鳥 けむり</text>

  <!-- 赤のアクセント -->
  <rect x="300" y="382" width="600" height="7" fill="#cf3a2d"/>

  <!-- 入口の灯り -->
  <rect x="420" y="470" width="360" height="300" fill="#f6f3ec" fill-opacity=".07"/>
  <rect x="420" y="470" width="360" height="300" fill="none" stroke="#f6f3ec" stroke-opacity=".18"/>
  <ellipse cx="600" cy="790" rx="330" ry="90" fill="url(#glow)"/>

  <!-- 暖簾 -->
  <rect x="420" y="470" width="360" height="72" fill="#cf3a2d" fill-opacity=".82"/>
  <line x1="540" y1="470" x2="540" y2="542" stroke="#0a1120" stroke-opacity=".35" stroke-width="3"/>
  <line x1="660" y1="470" x2="660" y2="542" stroke="#0a1120" stroke-opacity=".35" stroke-width="3"/>

  <!-- 煙 -->
  <path d="M780 470 C 800 400 760 360 790 300 C 812 258 786 232 800 196" fill="none" stroke="url(#smoke)" stroke-width="16" stroke-linecap="round"/>
  <path d="M840 470 C 858 414 826 384 852 336" fill="none" stroke="url(#smoke)" stroke-width="11" stroke-linecap="round"/>

  <!-- 地面 -->
  <rect x="0" y="770" width="1200" height="130" fill="#0a1120"/>
  <line x1="0" y1="770" x2="1200" y2="770" stroke="#f6f3ec" stroke-opacity=".12"/>

</svg>
